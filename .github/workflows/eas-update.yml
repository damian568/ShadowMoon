name: EAS Update

on:
  push:
    branches: [main]

# A newer push makes an older, still-running publish pointless.
concurrency:
  group: eas-update
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: Publish update to the preview channel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: eas update --channel preview --message "$COMMIT_MESSAGE" --environment preview --non-interactive
