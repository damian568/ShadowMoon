name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, clean tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly what package-lock.json says and fails if it disagrees with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The pipeline must not change the repository. A dirty tree here means something that should have
      # been committed (e.g. an out-of-date lockfile or a generated file) or ignored was left behind.
      - name: Check git status (working tree must be clean)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The working tree is not clean after the pipeline ran."
            git status --short
            git --no-pager diff --stat
            exit 1
          fi
          echo "Working tree is clean."

  # Lint is reported but does not block merging yet: the app code has existing React-hooks rule violations
  # that are still being worked through. Remove `continue-on-error` once `npm run lint` passes.
  lint:
    name: Lint (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
